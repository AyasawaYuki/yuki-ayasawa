    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('./docs/index.html');

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            var root = document.getElementById('root');

              window.location.replace('./docs/index.html');
            }
          }, 500);
        });
      }
